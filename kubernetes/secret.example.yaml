# Exemple uniquement : ne jamais committer de vraies valeurs.
# Créer le vrai Secret avec :
  # kubectl -n marketplace create secret generic marketplace-db \
  #   --from-literal=DB_USER=marketplace \
  #   --from-literal=DB_PASSWORD='ylies@123456789' \
  #   --from-literal=DB_NAME=marketplace
  #   --from-literal=ADMIN_EMAIL='admin@admin.fr' \
  #   --from-literal=ADMIN_PASSWORD='P@ssw0rd'
# ADMIN_EMAIL et ADMIN_PASSWORD sont optionnels (compte administrateur créé au démarrage).
# sudo k3s kubectl create secret docker-registry ghcr-secret \
#   --namespace marketplace \
#   --docker-server=ghcr.io \
#   --docker-username='<GithubUser>' \
#   --docker-password='<TOKEN>'

apiVersion: v1
kind: Secret
metadata:
  name: marketplace-db
  namespace: marketplace
type: Opaque
stringData:
  DB_USER: marketplace
  DB_PASSWORD: change-me
  DB_NAME: marketplace
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: change-me-too


