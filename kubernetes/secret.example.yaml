# Exemple uniquement : ne jamais committer de vraies valeurs.
# Créer le vrai Secret avec :
#   kubectl -n marketplace create secret generic marketplace-db \
#     --from-literal=DB_USER=marketplace \
#     --from-literal=DB_PASSWORD='<mot-de-passe>' \
#     --from-literal=DB_NAME=marketplace \
#     --from-literal=ADMIN_EMAIL='<email-admin>' \
#     --from-literal=ADMIN_PASSWORD='<mot-de-passe-admin>'
# ADMIN_EMAIL et ADMIN_PASSWORD sont optionnels (compte administrateur créé au démarrage).
apiVersion: v1
kind: Secret
metadata:
  name: marketplace-db
  namespace: marketplace
type: Opaque
stringData:
  DB_USER: marketplace
  DB_PASSWORD: change-me
  DB_NAME: marketplace
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: change-me-too
