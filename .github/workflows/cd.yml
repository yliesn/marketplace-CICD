name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to K3s
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve image tag
        id: image
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          TAG=$(git tag --points-at HEAD --list 'v*' | head -n1)
          if [ -n "$TAG" ]; then
            echo "tag=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBECONFIG_FILE: ${{ secrets.KUBECONFIG_FILE }}
        run: |
          KUBECONFIG_PATH="$RUNNER_TEMP/kubeconfig"
          printf '%s\n' "$KUBECONFIG_FILE" > "$KUBECONFIG_PATH"
          chmod 600 "$KUBECONFIG_PATH"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Deploy to K3s
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -e

          echo "Déploiement de l'image : $IMAGE_TAG"

          kubectl apply \
            -f kubernetes/namespace.yaml

          kubectl apply \
            -f kubernetes/postgres-configmap.yaml \
            -f kubernetes/postgres-pvc.yaml \
            -f kubernetes/postgres-deployment.yaml \
            -f kubernetes/postgres-service.yaml

          kubectl apply \
            -f kubernetes/app-deployment.yaml \
            -f kubernetes/app-service.yaml \
            -f kubernetes/app-ingress.yaml

          kubectl set image deployment/marketplace \
            marketplace=ghcr.io/yliesn/marketplace:$IMAGE_TAG \
            -n marketplace

          kubectl rollout status \
            deployment/marketplace \
            -n marketplace \
            --timeout=180s

          echo "Déploiement terminé !"

          kubectl get pods -n marketplace

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
